; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32doit-devkit-v1
src_dir = ./src_master

[common]
platform = espressif32@6.12.0
framework = arduino
lib_deps =
    https://github.com/Giddy-Up224/esp_log_alias.git
build_flags =
    ; Change this log level to whatever your logging needs are
    ; Additional logging flags/options available. See esp32-hal-log.h for full list.
    ; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_NONE
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_ERROR
    ; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_WARN
    ; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
    ; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    ; -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE

[env:esp32doit-devkit-v1]
extends = common
board = esp32doit-devkit-v1
framework = arduino

monitor_filters = 
	time
	log2file